[project]
name = "agent-rs-backend"
version = "0.1.0"
description = "FastAPI backend for Agent-RS, an AI Agent system for remote-sensing workflows."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "asyncpg>=0.29.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2.0",
  "cryptography>=3.1",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1.0",
  "charset-normalizer>=3.3.0",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17.0",
  "Pillow>=10.0.0",
  "rasterio>=1.3.0",
  "numpy>=1.24.0",
  "tiktoken>=0.7.0",
  # AutoGen 编排层。业务代码不直接 import autogen_*，一律经 app/agent/engine/ 适配层，
  # 便于将来迁到继任框架 MAF（AutoGen 官方已进入 maintenance mode，不再增加新特性）。
  # 版本钉死 0.7.5：本地已逐项核实过能力的 checkout（python-v0.7.5-8-g027ecf0a3）。
  "autogen-core==0.7.5",
  "autogen-agentchat==0.7.5",
  "autogen-ext[openai,mcp]==0.7.5",
  # autogen-ext 0.7.5 只声明 mcp>=1.11.0（无上界），但它是针对 mcp 1.x API 写的。
  # mcp 2.0.0 移除了 mcp.shared.context.RequestContext，会让 autogen_ext.tools.mcp 直接 ImportError。
  # AutoGen 已进入 maintenance mode，不会有上游修复，因此必须在这里钉死上界。
  "mcp>=1.11.0,<2",
  "pystac-client>=0.9.0",
  "lightrag-hku==1.5.7",
  # Keep LightRAG's Google helpers compatible with AutoGen's protobuf 5 runtime.
  "protobuf==5.29.6",
  "google-api-core==2.25.1",
  "googleapis-common-protos==1.70.0",
  "proto-plus==1.26.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "scipy>=1.10",
  "shapely>=2.0"
]
# 对象存储后端。仅 STORAGE_BACKEND=minio 时需要；本地后端（默认）无需安装。
# 代码内 minio 为懒加载 import（MinioStore 方法内），未装也不影响本地后端启动。
minio = [
  "minio>=7.2.0"
]

[project.scripts]
agent-rs-backend = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agent.prompting.templates" = ["*.jinja", "README.md"]
"app.agent.search" = ["*.jinja"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
