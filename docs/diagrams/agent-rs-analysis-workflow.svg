<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090">
<title>Agent-RS 平台使用流程</title>
<desc>准备影像或地图选区，确认分析对象，在右侧对话提出任务，在地图查看并下载实际完成的成果。功能图谱可用于了解能力和保存个人定义。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
<defs>
<marker id="main" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="optional" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#7c3aed"/></marker>
<marker id="retry" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#ea580c"/></marker>
</defs><rect width="1200" height="1090" fill="#fff"/>
<text x="60" y="54" text-anchor="start" font-size="15" font-weight="650" fill="#2563eb">AGENT-RS · 平台使用流程</text>
<text x="60" y="98" text-anchor="start" font-size="30" font-weight="700" fill="#111827">从准备数据，到查看分析成果</text>
<text x="60" y="127" text-anchor="start" font-size="16" font-weight="400" fill="#64748b">左侧选择功能 · 右侧发起对话 · 地图中查看结果</text>
<path d="M76 170 H360 L344 278 H60 Z" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="210.0" y="206" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">上传本地影像</text>
<text x="210.0" y="236" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">GeoTIFF 文件</text>
<text x="210.0" y="263" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">保留影像范围与波段信息</text>
<path d="M466 170 H750 L734 278 H450 Z" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="600.0" y="206" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">检索卫星影像</text>
<text x="600.0" y="236" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">按区域、日期与云量检索</text>
<text x="600.0" y="263" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">预览后导入需要的影像</text>
<path d="M856 170 H1140 L1124 278 H840 Z" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="990.0" y="206" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">框选地图区域</text>
<text x="990.0" y="236" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">选择分析范围与数据来源</text>
<text x="990.0" y="263" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">使用当前影像或地图底图</text>
<path d="M210 278 V310 H990 V278 M600 278 V310" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M600 310 V350" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<rect x="400" y="350" width="400" height="108" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="600.0" y="386" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">确认分析对象</text>
<text x="600.0" y="416" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">检查当前影像、区域与任务需求</text>
<text x="600.0" y="443" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">不同分析需要相应分辨率和波段</text>
<path d="M600 458 V520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<rect x="400" y="520" width="400" height="108" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="600.0" y="556" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">在右侧对话提出任务</text>
<text x="600.0" y="586" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">例如：提取建筑、检测船舶</text>
<text x="600.0" y="613" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">或计算指数、识别水体</text>
<rect x="60" y="500" width="260" height="224" rx="12" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="190.0" y="536" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">功能图谱（可选）</text>
<text x="190.0" y="566" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">浏览平台能力与数据关系</text>
<text x="190.0" y="593" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">查看地物分类、目标检测等工具</text>
<text x="190.0" y="620" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">按需编辑实体、关系和条件</text>
<text x="190.0" y="647" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">保存个人定义</text>
<text x="190.0" y="674" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">在后续新规划中使用</text>
<path d="M320 574 H400" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="6 5"/>
<rect x="339.0" y="557" width="42" height="25" rx="4" fill="#fff"/>
<text x="360" y="574" text-anchor="middle" font-size="14" font-weight="400" fill="#7c3aed">定义</text>
<path d="M600 628 V690" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<rect x="400" y="690" width="400" height="108" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="600.0" y="726" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">执行任务并查看进度</text>
<text x="600.0" y="756" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">平台核对数据条件并调用工具</text>
<text x="600.0" y="783" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">显示进度、实际结果或失败原因</text>
<rect x="880" y="690" width="260" height="108" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1010.0" y="726" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">按提示调整</text>
<text x="1010.0" y="756" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">补充影像、范围或参数</text>
<text x="1010.0" y="783" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">处理问题后重新提交</text>
<path d="M800 744 H880" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retry)" stroke-dasharray="6 5"/>
<rect x="819.0" y="727" width="42" height="25" rx="4" fill="#fff"/>
<text x="840" y="744" text-anchor="middle" font-size="14" font-weight="400" fill="#ea580c">异常</text>
<path d="M1010 690 V404 H800" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retry)" stroke-dasharray="6 5"/>
<rect x="968.0" y="531" width="84" height="25" rx="4" fill="#fff"/>
<text x="1010" y="548" text-anchor="middle" font-size="14" font-weight="400" fill="#ea580c">补充后重试</text>
<path d="M600 798 V860" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<path d="M376 860 H840 L824 980 H360 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="600.0" y="896" text-anchor="middle" font-size="21" font-weight="650" fill="#111827">地图查看与成果下载</text>
<text x="600.0" y="926" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">查看图层、类别、数量及分析说明</text>
<text x="600.0" y="953" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">下载实际生成的成果，按需汇总报告</text>
<path d="M72 1016 H112" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="124" y="1021" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">主要操作</text>
<path d="M340 1016 H380" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="6 5"/>
<text x="392" y="1021" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">可选定义</text>
<path d="M608 1016 H648" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retry)" stroke-dasharray="6 5"/>
<text x="660" y="1021" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">补充与重试</text>
<text x="60" y="1061" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">地图底图通常只有 RGB 波段；可用能力以实际影像与模型配置为准。报告只汇总已完成的分析。</text>
</svg>
