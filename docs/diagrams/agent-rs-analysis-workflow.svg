<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1930" viewBox="0 0 1400 1930" role="img" aria-labelledby="title desc">
<title id="title">遥感分析流程图</title>
<desc id="desc">从数据与任务出发，经受控计算，回到地图成果与可核查报告</desc>
<style>text {font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;} path,line,rect,polygon,ellipse {stroke-linejoin:round;stroke-linecap:round;}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="1930" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="56" y="53" text-anchor="start" fill="#2563eb" font-size="14" font-weight="700">AGENT-RS  /  REMOTE SENSING</text>
<text x="56" y="100" text-anchor="start" fill="#111827" font-size="32" font-weight="700">遥感分析流程图</text>
<text x="56" y="130" text-anchor="start" fill="#64748b" font-size="16" font-weight="400">从数据与任务出发，经受控计算，回到地图成果与可核查报告</text>
<polygon points="96,172 440,172 424,268 80,268" fill="#ecfdf5" stroke="#d1d5db" stroke-width="1.5"/>
<text x="260.0" y="202" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">本地影像</text>
<text x="260.0" y="228" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">上传 GeoTIFF</text>
<text x="260.0" y="251" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">保留坐标与波段语义</text>
<polygon points="536,172 880,172 864,268 520,268" fill="#ecfdf5" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700.0" y="202" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">公开影像</text>
<text x="700.0" y="228" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">STAC 搜索 → 预览 / 导入</text>
<text x="700.0" y="251" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">区域 / 时间 / 云量</text>
<polygon points="976,172 1320,172 1304,268 960,268" fill="#ecfdf5" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1140.0" y="202" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">地图选区</text>
<text x="1140.0" y="228" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">prepare_map_roi 按需取图</text>
<text x="1140.0" y="251" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">底图仅 RGB，无 NIR / SWIR</text>
<path d="M 260,268 L 260,308 L 700,308" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 700,268 L 700,308 L 700,308" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 1140,268 L 1140,308 L 700,308" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 700,308 L 700,352" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="460" y="352" width="480" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700.0" y="382" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">确认分析对象</text>
<text x="700.0" y="408" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">当前影像 ID · 空间范围 · 波段角色</text>
<text x="700.0" y="431" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">可在对话工具循环中继续取图 / 导入</text>
<path d="M 700,442 L 700,492" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="460" y="492" width="480" height="90" rx="10" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700.0" y="522" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">提交自然语言任务</text>
<text x="700.0" y="548" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">选中影像 + 可选 ROI + 用户要求</text>
<text x="700.0" y="571" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">装配历史、已有成果与相关知识</text>
<rect x="1010" y="492" width="310" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1165.0" y="522" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">检索与上下文</text>
<text x="1165.0" y="548" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">RAG / 长期记忆按需注入</text>
<text x="1165.0" y="571" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">每次模型调用受预算约束</text>
<path d="M 1010,537 L 940,537" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
<path d="M 700,582 L 700,648" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<polygon points="700,648 888,712 700,776 512,712" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
