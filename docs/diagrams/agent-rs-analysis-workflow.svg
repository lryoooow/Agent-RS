<text x="700" y="737" text-anchor="middle" fill="#64748b" font-size="14" font-weight="400">结构化路由</text>
<path d="M 512,712 L 320,712 L 320,822" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="232.06" y="749" width="175.88" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="320" y="766" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="400">否 / 不确定 / 路由失败</text>
<path d="M 888,712 L 1080,712 L 1080,822" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="1065.0" y="749" width="30" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1080" y="766" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="400">是</text>
<rect x="110" y="822" width="420" height="96" rx="10" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="114" y="826" width="412" height="88" rx="7" fill="none" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="320.0" y="852" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">主 Agent</text>
<text x="320.0" y="878" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">自由任务自主选择工具</text>
<text x="320.0" y="901" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">无影像时可走快车道</text>
<rect x="870" y="822" width="420" height="96" rx="10" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="874" y="826" width="412" height="88" rx="7" fill="none" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="1080.0" y="852" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">GraphFlow</text>
<text x="1080.0" y="878" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">按固定顺序执行领域节点</text>
<text x="1080.0" y="901" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">标准作业由报告节点收尾</text>
<path d="M 320,918 L 320,956 L 700,956" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 1080,918 L 1080,956 L 700,956" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M 700,956 L 700,1004" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="490" y="1004" width="420" height="88" rx="10" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700.0" y="1034" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">当前 Agent / 流节点</text>
<text x="700.0" y="1060" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">选择本步工具与参数</text>
<path d="M 700,1092 L 700,1166" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
