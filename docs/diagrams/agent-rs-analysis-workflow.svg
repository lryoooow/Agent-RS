<text x="700.0" y="1196" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">校验与登记</text>
<text x="700.0" y="1222" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">配额 / 参数 / 资源归属 / 分析前置条件</text>
<text x="700.0" y="1245" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">登记任务 · 准备影像 · 执行期心跳</text>
<path d="M 700,1262 L 700,1340" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="664.0" y="1287" width="72" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="700" y="1304" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="400">校验通过</text>
<rect x="490" y="1340" width="420" height="94" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700.0" y="1370" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">调用能力</text>
<text x="700.0" y="1396" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">MCP 栅格 / YOLO · HTTP SAM3</text>
<text x="700.0" y="1419" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">或影像检索、导入、报告等共享工具</text>
<path d="M 700,1434 L 700,1508" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<rect x="490" y="1508" width="420" height="100" rx="10" fill="#ecfdf5" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700.0" y="1538" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">收集执行结果</text>
<text x="700.0" y="1564" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">摘要回到模型 · 产物进入回合状态</text>
<text x="700.0" y="1587" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">终态记录 / SSE 阶段与地图更新</text>
<polygon points="1110,1494 1250,1558 1110,1622 970,1558" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="1110" y="1565" text-anchor="middle" fill="#111827" font-size="19" font-weight="700">还需下一步？</text>
<path d="M 910,1558 L 970,1558" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<path d="M 1110,1494 L 1338,1494 L 1338,1048 L 910,1048" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<rect x="1030.03" y="1033" width="179.94" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1120" y="1050" text-anchor="middle" fill="#7c3aed" font-size="14" font-weight="400">是：工具循环 / 下一节点</text>
<path d="M 1110,1622 L 1110,1690 L 700,1690 L 700,1740" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="964.0" y="1675" width="72" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1000" y="1692" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="400">否：汇总</text>
<rect x="100" y="1166" width="300" height="118" rx="10" fill="#fff7ed" stroke="#d1d5db" stroke-width="1.5"/>
<text x="250.0" y="1196" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">拒绝或执行失败</text>
<text x="250.0" y="1222" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">给出真实原因与已完成部分</text>
<text x="250.0" y="1245" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">修改前提后才重新执行</text>
<text x="250.0" y="1268" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">未执行内容不生成分析结论</text>
<path d="M 490,1214 L 400,1214" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
<rect x="423.0" y="1199" width="44" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="445" y="1216" text-anchor="middle" fill="#ea580c" font-size="14" font-weight="400">拒绝</text>
<path d="M 490,1387 L 250,1387 L 250,1284" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
<rect x="337.0" y="1372" width="44" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="359" y="1389" text-anchor="middle" fill="#ea580c" font-size="14" font-weight="400">失败</text>
<path d="M 100,1225 L 60,1225 L 60,1787 L 438.3,1787" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
<rect x="214.0" y="1772" width="72" height="23" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="250" y="1789" text-anchor="middle" fill="#ea580c" font-size="14" font-weight="400">反馈原因</text>
<polygon points="446,1740 970,1740 954,1838 430,1838" fill="#ecfdf5" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700.0" y="1770" text-anchor="middle" fill="#111827" font-size="20" font-weight="700">交付成果</text>
<text x="700.0" y="1796" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">地图图层 + 分析说明 + 可下载文件</text>
<text x="700.0" y="1819" text-anchor="middle" fill="#64748b" font-size="15" font-weight="400">按需生成报告：本轮成功结果 + 会话已存成果</text>
<path d="M 56,1870 L 94,1870" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="105" y="1875" text-anchor="start" fill="#64748b" font-size="14" font-weight="400">请求 / 数据</text>
<path d="M 265,1870 L 303,1870" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="314" y="1875" text-anchor="start" fill="#64748b" font-size="14" font-weight="400">上下文 / 存储</text>
<path d="M 494,1870 L 532,1870" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="543" y="1875" text-anchor="start" fill="#64748b" font-size="14" font-weight="400">结果反馈</text>
<path d="M 695,1870 L 733,1870" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
<text x="744" y="1875" text-anchor="start" fill="#64748b" font-size="14" font-weight="400">异常 / 拒绝</text>
<text x="56" y="1908" text-anchor="start" fill="#64748b" font-size="13" font-weight="400">图聚焦需要工具的分析任务，纯问答可直接返回；底图可在工具循环中获取，报告按需生成。循环也表示 GraphFlow 节点推进。</text>
</svg>
