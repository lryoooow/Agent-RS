# 本地基础设施：PostgreSQL（含 pgvector）+ MinIO（对象存储），供后端开发与测试共用。
# 用法：
#   docker compose up -d db         # 只起库（默认 STORAGE_BACKEND=local，影像落本地盘）
#   docker compose up -d db minio   # 起库 + 对象存储（STORAGE_BACKEND=minio 时需要）
#   docker compose down             # 停服务（保留数据卷）
#   Never remove data volumes to rotate credentials.
#
# 连接串（已对齐 backend/.env.example 的默认）：
#   PG credentials: AGENT_RS_DB_PASSWORD; keep backend DATABASE_URL synchronized.
#   MinIO: loopback :9000/:9001, AGENT_RS_MINIO_PASSWORD; keep MINIO_SECRET_KEY synchronized.
#
# 注意：5432 是本机 PostgreSQL 标准端口；若宿主机已装有本地 PG 占用 5432，
# 请改回非冲突端口（如 15432:5432）并同步调整 backend/.env 的 DATABASE_URL。
#
# 注意：MCP 遥感工具镜像（docker/ 下）走 `docker run` 独立启动，与本 compose 互不影响。

services:
  db:
    # G9：钉具体 pgvector 版本（>=0.8 才有 hnsw.iterative_scan，
    # 租户过滤召回保障依赖它；浮动 tag 升级可能悄悄降级到 <0.8 行为）。
    image: pgvector/pgvector:0.8.3-pg16
    container_name: agent_rs_pg
    environment:
      POSTGRES_USER: agent_rs
      POSTGRES_PASSWORD: ${AGENT_RS_DB_PASSWORD:?Set AGENT_RS_DB_PASSWORD in the private root .env or environment}
      POSTGRES_DB: agent_rs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agent_rs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_rs -d agent_rs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 对象存储（影像二进制）。控制台 :9001，S3 API :9000。
  # 启用：后端 .env 设 STORAGE_BACKEND=minio + MINIO_* 凭据；桶由后端启动时幂等创建。
  #   docker compose up -d db minio
  minio:
    image: minio/minio:latest
    container_name: agent_rs_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agent_rs
      MINIO_ROOT_PASSWORD: ${AGENT_RS_MINIO_PASSWORD:?Set AGENT_RS_MINIO_PASSWORD in the private root .env or environment}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - agent_rs_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_rs_pgdata:
  agent_rs_minio:
